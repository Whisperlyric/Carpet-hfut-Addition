# Fabric Properties
	# check these on https://fallen-breath.github.io/fabric-versions/?&version=26.3
	minecraft_version=26.3
	# 26.3 needs a newer loader than the root default; override here only
	loader_version=0.19.5

# Fabric Mod Metadata
	carpet_dependency=>=26.3
	minecraft_dependency=>=26.3-

# Build Information
	# The target mc versions for the mod during mod publishing, separated with \n
	game_versions=26.3

# Mod Dependency
# check available versions on maven for the given minecraft version you are using
# https://masa.dy.fi/maven/carpet/fabric-carpet/
# masa's maven is stale at 26.3-beta-3 (its own mixins fail on final 26.3);
# the final release is pulled from jitpack via the GitHub tag, cf. TIS
	carpet_core_version = com.github.gnembon:fabric-carpet:v26.3

# Dependencies
	fabric_api_version=0.160.6+26.3
